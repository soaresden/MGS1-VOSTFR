; Batocera port: keyboard shortcuts of the recomp (host_keymap.c), next to the executable (bin/<cpu>/config.ini).
; A handheld has no keyboard, but Batocera turns some pad combinations into keys: F11 put the game in a window,
; F12 started a replay recording ("REC" on screen, no way to stop it). "None" turns a shortcut off.
; Kept: the in-game menu (F1; Select + L3 on the pad), the save states (F5, Shift+F5, F7) and the volume.
[KeyMap]
Fullscreen = None
ReplayRecord = None
Rewind = None
Turbo = None
TurboToggle = None
DisplayPerf = None
Scanlines = None
AnalogMode = None
SwapControllerPorts = None
OpenLauncher = None
CaptureMark = None
MouseCapture = None
