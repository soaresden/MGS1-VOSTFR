<?xml version="1.0" encoding="UTF-8"?>
<!--
  Metal Gear Solid (PS1 recompiled, alexbeavs psxrecomp + mods MGS1-VOSTFR) for Batocera: options in the game's
  ADVANCED GAME OPTIONS, submenu "METAL GEAR SOLID". EmulationStation merges this file (it reads every
  es_features_*.cfg in /userdata/system/configs/emulationstation/) into the "sh" emulator of the Ports system, so the
  submenu also shows for the other ports: they ignore it. "Metal Gear Solid.sh" copies it there and reads the values
  from batocera.conf (ports["Metal Gear Solid.sh"].mgs_*).
-->
<features>
  <emulator name="sh">
    <features>
      <feature name="DISQUE" value="mgs_disc" submenu="METAL GEAR SOLID" order="1"
               description="Auto : le disque du dernier lancement. A la fin du disque 1, quittez (Hotkey + Start), choisissez Disque 2 et relancez : les mods suivent le disque.">
        <choice name="Auto (le dernier)" value="auto"/>
        <choice name="Disque 1" value="1"/>
        <choice name="Disque 2" value="2"/>
      </feature>
      <feature name="TEXTES EN FRANCAIS" value="mgs_french" submenu="METAL GEAR SOLID" order="2"
               description="Codec, voix en jeu, cinematiques, menus et resumes de mission sous-titres en francais (voix anglaises). Desactive : la version USA d'origine, avec les autres mods.">
        <choice name="Actives" value="on"/>
        <choice name="Desactives (anglais)" value="off"/>
      </feature>
      <feature name="RENDU" value="mgs_renderer" submenu="METAL GEAR SOLID" order="3"
               description="Auto : celui du jeu (OpenGL). Vulkan : pilote Turnip de la Retroid. Logiciel : le plus lent, en secours.">
        <choice name="Auto (OpenGL)" value="auto"/>
        <choice name="Vulkan" value="vulkan"/>
        <choice name="OpenGL" value="opengl"/>
        <choice name="Logiciel" value="software"/>
      </feature>
      <feature name="IMAGE" value="mgs_ratio" submenu="METAL GEAR SOLID" order="4"
               description="16/9 : la 3D est elargie a tout l'ecran (pas etiree). 4/3 : l'image d'origine de la PS1, bandes noires sur les cotes.">
        <choice name="16/9 (ecran large)" value="16/9"/>
        <choice name="4/3 (PS1 d'origine)" value="4/3"/>
      </feature>
      <feature name="LOGO PLAYSTATION" value="mgs_bios_logo" submenu="METAL GEAR SOLID" order="5"
               description="Le logo Sony / PlayStation du BIOS au demarrage. Saute : le jeu demarre tout de suite.">
        <choice name="Saute" value="off"/>
        <choice name="Affiche" value="on"/>
      </feature>
      <feature name="RENDU EN PARALLELE" value="mgs_render_thread" submenu="METAL GEAR SOLID" order="6"
               description="Le dessin de l'image (OpenGL) sur un autre coeur du processeur : le jeu tourne plus vite, le son ne craque plus. Desactive : tout sur un seul coeur, comme le recomp d'origine.">
        <choice name="Active" value="on"/>
        <choice name="Desactive" value="off"/>
      </feature>
      <!-- MODS -->
    </features>
  </emulator>
</features>
